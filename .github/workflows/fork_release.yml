# Hand-written (NOT generated by `cargo xtask workflows`).
#
# Convenience workflow for building unsigned Zed bundles from a personal fork,
# so you can run a branch before its PR is merged upstream.
#
# Differences from the upstream `release.yml` / `run_bundling.yml`:
#   - Uses GitHub-hosted runners instead of Zed's private Namespace/self-hosted
#     runners, so it works on a fork with no special infrastructure.
#   - Trigger is manual only. Run it from the Actions tab via "Run workflow" and
#     pick the branch you want to build.
#
# macOS signing (optional): if the repository defines the secrets below, the mac
# build is signed with your own Developer ID and notarized, so it opens with a
# normal double-click on any Mac (including MDM-managed ones). If they are absent
# the build still succeeds but is only ad-hoc signed (right-click -> Open, and it
# may be blocked on locked-down Macs). Required secrets:
#   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   MACOS_CERTIFICATE            base64 of the exported Developer ID .p12
#   MACOS_CERTIFICATE_PASSWORD   password used when exporting the .p12
#   APPLE_NOTARIZATION_KEY       contents of an App Store Connect API key (.p8)
#   APPLE_NOTARIZATION_KEY_ID    that key's Key ID
#   APPLE_NOTARIZATION_ISSUER_ID the Issuer ID (UUID) from the API Keys page
#
# Windows is always unsigned: click "More info" -> "Run anyway" on the SmartScreen
# prompt once. The installer is per-user, so no admin rights are needed.
#
# Artifacts (the .dmg / .exe installer) are attached to the run summary page.
name: fork_release
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: '1'
  # Fetch git dependencies with the git CLI so Windows long-path support
  # (core.longpaths) is honored; some deps have paths past the 260-char limit.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: both
        options:
        - both
        - windows
        - macos
permissions:
  contents: read
jobs:
  bundle_mac_aarch64:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'macos' }}
    # macos-15 ships Xcode 16 / the MacOSX15 SDK. On macos-14 (Xcode 15.4) the
    # webrtc-sys build fails a C++20 <ranges> static_assert in cxx.h, because
    # rust::Slice's iterator isn't a contiguous_iterator under that libc++.
    runs-on: macos-15
    # The signing secrets live in this environment, so the job must declare it or
    # they resolve to empty and the build silently falls back to unsigned.
    environment: "macOS build"
    steps:
    - name: Checkout repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: Show toolchain
      run: |
        xcodebuild -version
        xcrun --show-sdk-version
        ls /Applications | grep -i '^Xcode' || true
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '20'
    - name: Add Rust target
      run: rustup target add aarch64-apple-darwin
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        key: macos-aarch64
        cache-on-failure: true
    - name: Bundle macOS app
      run: ./script/bundle-mac aarch64-apple-darwin
      # Scoped to this step rather than the job, so no other action in the job --
      # including the third-party cache action -- ever has the signing
      # credentials in scope.
      env:
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    - name: Upload Zed-aarch64.dmg
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
        if-no-files-found: error
    # A cold release build of Zed on a free 4-core hosted runner exceeds two
    # hours; Zed's own CI uses 32-vCPU machines. 350 leaves headroom under the
    # 6-hour hosted-runner ceiling. Cached runs finish far sooner.
    timeout-minutes: 350
  bundle_windows_x86_64:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'windows' }}
    runs-on: windows-2022
    steps:
    - name: Checkout repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: Prepare Windows build environment
      shell: pwsh
      run: |
        # 0) Enable long paths. Some cargo git dependencies (e.g. the `pet`
        #    crate's test fixtures) have paths past Windows' 260-char limit, which
        #    breaks `cargo fetch`/`cargo build`. Enable it at the OS level and for
        #    git (CARGO_NET_GIT_FETCH_WITH_CLI makes cargo use git, which honors it).
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
        git config --system core.longpaths true

        # bundle-windows.ps1 hardcodes toolchain paths that assume Zed's own
        # runner image. GitHub's windows-2022 image lays some of them out
        # differently, so junction the expected paths into place here instead of
        # editing the shared script.

        # 1) Visual Studio: the script expects the "Community" edition path, but
        #    the hosted image ships "Enterprise". Point Community at whatever
        #    vswhere reports as the latest install.
        $communityPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"
        if (-not (Test-Path "$communityPath\Common7\Tools\Launch-VsDevShell.ps1")) {
            $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -property installationPath
            if (-not $vsPath) { throw "Could not locate a Visual Studio 2022 installation" }
            Write-Host "Junctioning $communityPath -> $vsPath"
            New-Item -ItemType Junction -Path $communityPath -Target $vsPath | Out-Null
        }

        # 2) Windows SDK: the script references makeAppx.exe under a specific SDK
        #    version. If that version is not installed, junction it to the newest
        #    installed SDK that actually contains makeAppx.exe.
        $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
        $wantSdk = Join-Path $sdkBin "10.0.26100.0"
        if (-not (Test-Path (Join-Path $wantSdk "x64\makeAppx.exe"))) {
            $latest = Get-ChildItem $sdkBin -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^10\.0\.\d+\.0$' -and (Test-Path (Join-Path $_.FullName "x64\makeAppx.exe")) } |
                Sort-Object Name -Descending | Select-Object -First 1
            if (-not $latest) { throw "No Windows 10 SDK with makeAppx.exe was found" }
            if (Test-Path $wantSdk) { Remove-Item $wantSdk -Recurse -Force }
            Write-Host "Junctioning $wantSdk -> $($latest.FullName)"
            New-Item -ItemType Junction -Path $wantSdk -Target $latest.FullName | Out-Null
        }

        # 3) Inno Setup: install it if the image does not already provide ISCC.exe
        #    at the path the script expects.
        if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "Installing Inno Setup via Chocolatey"
            choco install innosetup -y --no-progress
        }
    - name: Add Rust target
      shell: pwsh
      run: rustup target add x86_64-pc-windows-msvc
    - name: Prime cargo registry
      # bundle-windows.ps1 runs `cargo metadata --offline`; make sure the
      # registry is populated so that offline read succeeds.
      shell: pwsh
      run: cargo fetch
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        key: windows-x86_64
        cache-on-failure: true
    - name: Bundle Windows installer (unsigned)
      shell: pwsh
      run: script/bundle-windows.ps1 -Architecture x86_64
    - name: Upload Zed-x86_64.exe
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-x86_64.exe
        path: target/Zed-x86_64.exe
        if-no-files-found: error
    # A cold release build of Zed on a free 4-core hosted runner exceeds two
    # hours; Zed's own CI uses 32-vCPU machines. 350 leaves headroom under the
    # 6-hour hosted-runner ceiling. Cached runs finish far sooner.
    timeout-minutes: 350
concurrency:
  # Include the platform so a macOS run doesn't cancel an in-flight Windows run
  # (and vice versa); re-running the same platform still supersedes the old run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
